# Production Docker : docker compose -f compose.prod.yaml up -d --build
#
# Le .env est chargé tel quel (celui de Laragon convient) : les paramètres propres à Docker sont imposés ci-dessous.
# Base de données : POSTGRES_PASSWORD (obligatoire), POSTGRES_DATABASE et POSTGRES_USERNAME (par défaut app et
# laravel), à définir dans le .env avant le premier démarrage. Ils créent la base et servent à s'y connecter.
name: stockmanager

# PHP-FPM, worker et scheduler : une seule image, construite une fois
x-app: &app
  image: stockmanager-app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  restart: unless-stopped
  env_file: .env
  environment:
    # Prioritaires sur le .env (Laravel ne remplace pas une variable déjà définie)
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DATABASE:-app}
    DB_USERNAME: ${POSTGRES_USERNAME:-laravel}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans le .env}
    # pg_dump du conteneur, pour les sauvegardes : pas celui de Windows
    PGDUMP_PATH: /usr/bin/
  volumes:
    - laravel-storage-production:/var/www/storage

services:
  web:
    image: stockmanager-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # Fichiers du disque « public » (logo…), servis sous /storage ; Nginx n'écrit rien
      - laravel-storage-production:/var/www/storage:ro
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Migrations et mise en cache avant le démarrage de PHP-FPM
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # Le worker et le scheduler attendent php-fpm, qui applique les migrations avant de se déclarer prêt
  worker:
    <<: *app
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    depends_on:
      php-fpm:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      php-fpm:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    # Pas de port publié : seuls les conteneurs y accèdent. Console : docker compose exec postgres psql -U laravel app
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-app}
      POSTGRES_USER: ${POSTGRES_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans le .env}
    volumes:
      - postgres-data-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-production:
  laravel-storage-production:
