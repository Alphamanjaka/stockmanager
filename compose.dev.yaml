# Environnement de développement Docker — mode d'emploi : docs/docker-dev.md
#
# Conçu pour cohabiter avec Laragon sur la même machine :
# - ports différents par défaut (site : 8080, PostgreSQL : 5433), réglables via NGINX_PORT / POSTGRES_PORT ;
# - même fichier .env que Laragon : les paramètres propres à Docker (base, Redis) sont imposés ci-dessous ;
# - node_modules du conteneur dans un volume séparé (les binaires de Vite diffèrent entre Windows et Linux).
name: stockmanager-dev

x-docker-env: &docker-env
  # Prioritaires sur le .env (Laravel ne remplace pas une variable déjà définie)
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: app
  DB_USERNAME: laravel
  DB_PASSWORD: secret
  REDIS_HOST: redis
  PGDUMP_PATH: /usr/bin/
  APP_URL: http://localhost:${NGINX_PORT:-8080}

x-xdebug-args: &xdebug-args
  UID: ${UID:-1000}
  GID: ${GID:-1000}
  # Désactivé par défaut (il ralentit chaque requête) : XDEBUG_ENABLED=true puis reconstruire pour déboguer
  XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
  XDEBUG_MODE: develop,coverage,debug,profile
  XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
  XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
  XDEBUG_LOG: /dev/stdout
  XDEBUG_LOG_LEVEL: 0

services:
  web:
    image: nginx:latest # Using the default Nginx image with custom configuration.
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
      # Mount the Nginx configuration file
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_healthy  # Attendre que PHP-FPM soit PRÊT

  php-fpm:
    # For the php-fpm service, we will create a custom image to install the necessary PHP extensions and setup proper permissions.
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args: *xdebug-args
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
    env_file:
      # Load the environment variables from the Laravel application
      - .env
    environment: *docker-env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_healthy  # Attendre que la DB soit prête à accepter des connexions

  workspace:
    # Conteneur de travail : composer, artisan, npm (Vite), tests
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args: *xdebug-args
    ports:
      - '${VITE_PORT:-5173}:5173'
    tty: true  # Enables an interactive terminal
    stdin_open: true  # Keeps standard input open for 'docker exec'
    env_file:
      - .env
    environment:
      <<: *docker-env
      # Les fichiers modifiés sous Windows ne déclenchent pas d'événement dans le conteneur : Vite les surveille par scrutation
      VITE_POLLING: "true"
    volumes:
      - ./:/var/www
      # node_modules propre au conteneur (Linux) : celui de Windows (Laragon) reste intact
      - node-modules-development:/var/www/node_modules
    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=laravel
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    networks:
      - laravel-development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d app -U laravel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    networks:
      - laravel-development

networks:
  laravel-development:

volumes:
  postgres-data-development:
  node-modules-development:
