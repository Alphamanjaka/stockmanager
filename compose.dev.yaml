# Environnement de développement Docker — mode d'emploi : docs/docker-dev.md
#
# Conçu pour cohabiter avec Laragon sur la même machine :
# - ports différents par défaut (site : 8080, PostgreSQL : 5433), réglables via NGINX_PORT / POSTGRES_PORT ;
# - même fichier .env que Laragon : les paramètres propres à Docker (base de données) sont imposés ci-dessous ;
# - node_modules du conteneur dans un volume séparé (les binaires de Vite diffèrent entre Windows et Linux).
name: stockmanager-dev

# php-fpm et workspace : une seule image (PHP, Composer, Node), le code est monté depuis l'hôte
x-dev: &dev
  image: stockmanager-dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      # Désactivé par défaut (il ralentit chaque requête) : XDEBUG_ENABLED=true puis reconstruire pour déboguer
      XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
  env_file: .env
  environment: &dev-env
    # Prioritaires sur le .env (Laravel ne remplace pas une variable déjà définie)
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: app
    DB_USERNAME: laravel
    DB_PASSWORD: secret
    PGDUMP_PATH: /usr/bin/
    APP_URL: http://localhost:${NGINX_PORT:-8080}
  volumes:
    - ./:/var/www
  extra_hosts:
    # Xdebug joint l'éditeur sur l'hôte (nom fourni par Docker Desktop, à déclarer sous Linux)
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    <<: *dev
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace:
    # Terminal de travail : composer, artisan, npm (Vite), tests
    <<: *dev
    command: sleep infinity
    # Arrêt immédiat (sleep ignore le signal d'arrêt quand il est le premier processus)
    init: true
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      <<: *dev-env
      # Les fichiers modifiés sous Windows ne déclenchent pas d'événement dans le conteneur : Vite les surveille par scrutation
      VITE_POLLING: "true"
    volumes:
      - ./:/var/www
      # node_modules propre au conteneur (Linux) : celui de Windows (Laragon) reste intact
      - node-modules-development:/var/www/node_modules

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d app -U laravel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-development:
  node-modules-development:
