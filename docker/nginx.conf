# Nginx de StockManager, identique en développement et en production
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Fichiers envoyés (logo, imports Excel) : même limite que PHP (docker/php.ini)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /var/www/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Assets compilés par Vite : leur nom change à chaque version, le navigateur peut les garder
        location /build/ {
            expires max;
            access_log off;
            try_files $uri =404;
        }

        # Fichiers du disque « public » de Laravel (logo…), servis sans lien public/storage
        location /storage/ {
            alias /var/www/storage/app/public/;
        }

        # Seul le point d'entrée de Laravel est exécuté par PHP (comme la configuration nginx de la doc Laravel)
        location ~ ^/index\.php(/|$) {
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # Tout autre fichier PHP n'est ni exécuté ni servi en texte
        location ~ \.php$ {
            return 404;
        }
    }
}
