name: Laravel CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Job 1: Linting (Vérification du style de code avec Pint)
  lint:
    name: "Check Code Style (Pint)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: "Install Composer Dependencies"
        run: composer install --prefer-dist --no-progress --no-interaction

  # Job 2: Tests fonctionnels et unitaires
  test:
    name: "Tests (PostgreSQL 16)"
    runs-on: ubuntu-latest
    needs: lint # Ce job ne se lancera que si le 'lint' a réussi

    # PostgreSQL 16, le moteur de production (base de test comme en local : stockmanager_test)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stockmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stockmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stockmanager_test
      DB_USERNAME: test
      DB_PASSWORD: test

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: "Install Composer Dependencies"
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: "Prepare Database & Application"
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: "Run Migrations"
        run: php artisan migrate --force

      - name: "Execute Tests (PHPUnit)"
        run: php artisan test
