name: Laravel CI

on:
  push:
    branches: [ "main", "master" ]
  # Toutes les PR, y compris celles d'une pile (basées sur la branche d'une autre PR)
  pull_request:

# Un nouveau push sur une PR annule sa vérification en cours ; chaque commit de main garde la sienne
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Job 1: Style du code (Laravel Pint, préréglage Laravel). Corriger en local : vendor/bin/pint
  lint:
    name: "Check Code Style (Pint)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: "Install Composer Dependencies"
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: "Run Laravel Pint"
        run: vendor/bin/pint --test -v

  # Job 2: Construction des assets (Vite). Les tests tournent sans eux (withoutVite) :
  # sans ce job, une erreur de JavaScript ou de CSS passerait inaperçue.
  assets:
    name: "Build Assets (Vite)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: "Install NPM Dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build

  # Job 3: Images Docker de production (docker/Dockerfile) : sans ce job, une erreur de build ne se verrait qu'au déploiement
  docker:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Build app (PHP-FPM, worker, scheduler)"
        run: docker build -f docker/Dockerfile --target app .

      - name: "Build web (Nginx)"
        run: docker build -f docker/Dockerfile --target web .

  # Job 4: Tests fonctionnels et unitaires (indépendants du style : leurs résultats s'affichent toujours)
  test:
    name: "Tests (PostgreSQL 16)"
    runs-on: ubuntu-latest

    # PostgreSQL 16, le moteur de production (base de test comme en local : stockmanager_test)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stockmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stockmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stockmanager_test
      DB_USERNAME: test
      DB_PASSWORD: test

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: "Install Composer Dependencies"
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: "Prepare Database & Application"
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: "Run Migrations"
        run: php artisan migrate --force

      - name: "Execute Tests (PHPUnit)"
        run: php artisan test
